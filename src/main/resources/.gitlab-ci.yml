stages:
  - build
  - deploy

build:
  stage: build
  script:
    - echo "Building project..."
    - ./mvnw clean install -DskipTests

deploy:
  stage: deploy
  script:
    - echo "Deploying to server..."
    - ssh -o StrictHostKeyChecking=no ubuntu@YOUR_SERVER_IP "
      cd /home/ubuntu/app &&
      git pull &&
      ./mvnw clean install &&
      pkill -f 'java' || true &&
      nohup java -jar target/*.jar > app.log 2>&1 &
      "
  only:
    - main
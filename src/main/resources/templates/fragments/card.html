<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body>
	<!-- Standard Card with Icon -->
	<th:block th:fragment="card-icon(title, icon, color, link)">
		<div class="card h-100 shadow-sm card-hover border-0 position-relative">
			<div class="card-body text-center py-5" th:classappend="|text-${color}|">
				<i th:class="|fas fa-${icon} fa-3x mb-3|" aria-hidden="true"></i>
				<h5 class="card-title fw-bold">[[${title}]]</h5>
			</div>
			<a th:href="${link}" class="stretched-link" aria-label="[[${title}]]"></a>
		</div>
	</th:block>

	<!-- Product Card -->
	<th:block th:fragment="product-card(product)">
		<div class="card h-100 shadow-sm card-hover border-0 overflow-hidden">
			<div class="position-relative overflow-hidden" style="height: 200px; background-color: #f0f0f0;">
				<img th:if="${product.image}" th:src="|/img/${product.image}|" class="w-100 h-100 object-fit-cover" th:alt="${product.name}">
				<div th:if="!${product.image}" class="w-100 h-100 d-flex align-items-center justify-content-center">
					<i class="fas fa-image text-muted fa-3x"></i>
				</div>
				<th:block th:if="${product.active==false}">
					<span class="badge bg-danger position-absolute top-2 start-2">Out of Stock</span>
				</th:block>
			</div>
			<div class="card-body d-flex flex-column">
				<h6 class="card-title fw-bold line-clamp-2">[[${product.name}]]</h6>
				<p class="text-muted small flex-grow-1">[[${product.category.name}]]</p>
				<div class="d-flex justify-content-between align-items-center">
					<span class="h5 mb-0 text-primary fw-bold">₹[[${product.price}]]</span>
					<a th:href="@{/view-product/} + ${product.id}" class="btn btn-sm btn-outline-primary btn-hover-lift">
						<i class="fas fa-eye me-1"></i>View
					</a>
				</div>
			</div>
		</div>
	</th:block>

	<!-- Stat Card -->
	<th:block th:fragment="stat-card(label, value, icon, color)">
		<div class="card h-100 shadow-sm border-0 card-hover">
			<div class="card-body">
				<div class="d-flex justify-content-between align-items-start">
					<div>
						<p class="text-muted small mb-2 fw-bold">[[${label}]]</p>
						<h3 class="fw-bold mb-0">[[${value}]]</h3>
					</div>
					<div th:classappend="|bg-${color}-100 text-${color}|" class="p-3 rounded-3">
						<i th:class="|fas fa-${icon} fa-lg|"></i>
					</div>
				</div>
			</div>
		</div>
	</th:block>
</body>
</html>

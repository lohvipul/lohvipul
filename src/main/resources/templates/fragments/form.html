<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body>
	<!-- Text Input Field -->
	<th:block th:fragment="form-input(label, name, type, placeholder, required, value)">
		<div class="mb-3">
			<label th:for="${name}" class="form-label fw-bold">[[${label}]] <span th:if="${required}" class="text-danger">*</span></label>
			<input th:id="${name}" th:name="${name}" th:type="${type}" class="form-control form-control-lg border-1" 
				   th:placeholder="${placeholder}" th:value="${value}" th:required="${required}">
			<div th:id="|${name}-error|" class="invalid-feedback d-block mt-2 text-danger small"></div>
		</div>
	</th:block>

	<!-- Select Field -->
	<th:block th:fragment="form-select(label, name, options, optionLabel, optionValue, placeholder, required, selected)">
		<div class="mb-3">
			<label th:for="${name}" class="form-label fw-bold">[[${label}]] <span th:if="${required}" class="text-danger">*</span></label>
			<select th:id="${name}" th:name="${name}" class="form-select form-select-lg border-1" th:required="${required}">
				<option value="" disabled selected>[[${placeholder}]]</option>
				<option th:each="option : ${options}" th:value="${option[__${optionValue}__]}" 
						th:text="${option[__${optionLabel}__]}"
						th:selected="${selected == option[__${optionValue}__]}"></option>
			</select>
		</div>
	</th:block>

	<!-- Textarea Field -->
	<th:block th:fragment="form-textarea(label, name, placeholder, required, value, rows)">
		<div class="mb-3">
			<label th:for="${name}" class="form-label fw-bold">[[${label}]] <span th:if="${required}" class="text-danger">*</span></label>
			<textarea th:id="${name}" th:name="${name}" class="form-control form-control-lg border-1" 
					  th:placeholder="${placeholder}" th:required="${required}" th:rows="${rows}">[[${value}]]</textarea>
		</div>
	</th:block>

	<!-- Checkbox -->
	<th:block th:fragment="form-checkbox(label, name, checked)">
		<div class="form-check mb-3">
			<input class="form-check-input" type="checkbox" th:id="${name}" th:name="${name}" th:checked="${checked}">
			<label class="form-check-label" th:for="${name}">[[${label}]]</label>
		</div>
	</th:block>

	<!-- Submit Button -->
	<th:block th:fragment="form-submit(text, icon, isLoading)">
		<button type="submit" class="btn btn-primary btn-lg fw-bold w-100 btn-hover-lift">
			<i th:if="${icon}" th:class="|fas fa-${icon} me-2|"></i>[[${text}]]
		</button>
	</th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body>
	<!-- Modern Navbar Fragment -->
	<th:block th:fragment="navbar">
		<nav class="navbar navbar-expand-lg navbar-dark fixed-top shadow-sm" style="background: linear-gradient(135deg, #0d6efd 0%, #0b5af4 100%);">
			<div class="container-fluid">
				<!-- Brand -->
				<a class="navbar-brand fw-bold" href="/" style="font-size: 1.4rem;">
					<i class="fas fa-shopping-bag me-2"></i>Arbuda
				</a>
				
				<!-- Toggler -->
				<button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				
				<!-- Navigation Content -->
				<div class="collapse navbar-collapse" id="navbarContent">
					<!-- Left Navigation -->
					<ul class="navbar-nav me-auto mb-2 mb-lg-0">
						<th:block th:if="${user==null}">
							<li class="nav-item">
								<a class="nav-link" href="/">
									<i class="fas fa-home me-1"></i>Home
								</a>
							</li>
						</th:block>
						<th:block th:unless="${user==null}">
							<li class="nav-item" th:if="${user.role=='ROLE_ADMIN'}">
								<a class="nav-link" href="/admin/">
									<i class="fas fa-home me-1"></i>Home
								</a>
							</li>
							<li class="nav-item" th:if="${user.role=='ROLE_USER'}">
								<a class="nav-link" href="/">
									<i class="fas fa-home me-1"></i>Home
								</a>
							</li>
						</th:block>
						
						<li class="nav-item">
							<a class="nav-link" href="/products">
								<i class="fas fa-boxes me-1"></i>Products
							</a>
						</li>
						
						<li class="nav-item dropdown">
							<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
								<i class="fas fa-list me-1"></i>Categories
							</a>
							<ul class="dropdown-menu">
								<li th:each="c : ${categories}">
									<a class="dropdown-item" th:href="@{'/products?category='+${c.name}}">
										<i class="fas fa-tag me-2" style="width: 16px;"></i>[[${c.name}]]
									</a>
								</li>
							</ul>
						</li>
					</ul>
					
					<!-- Right Navigation -->
					<ul class="navbar-nav ms-auto mb-2 mb-lg-0">
						<th:block th:if="${user==null}">
							<li class="nav-item">
								<a class="nav-link" href="/signin">
									<i class="fas fa-sign-in-alt me-1"></i>Login
								</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="/register">
									<i class="fas fa-user-plus me-1"></i>Register
								</a>
							</li>
						</th:block>
						
						<th:block th:if="${user!=null}">
							<th:block th:if="${user.role=='ROLE_USER'}">
								<li class="nav-item">
									<a class="nav-link position-relative" href="/user/cart">
										<i class="fas fa-shopping-cart me-1"></i>Cart
										<span class="badge bg-danger position-absolute top-0 start-100 translate-middle" th:text="${countCart}">0</span>
									</a>
								</li>
							</th:block>
							
							<li class="nav-item dropdown">
								<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
									<i class="fas fa-user-circle me-1"></i>[[${user.name}]]
								</a>
								<ul class="dropdown-menu dropdown-menu-end">
									<li th:if="${user.role=='ROLE_USER'}">
										<a class="dropdown-item" href="/user/profile">
											<i class="fas fa-id-card me-2"></i>Profile
										</a>
									</li>
									<li th:if="${user.role=='ROLE_ADMIN'}">
										<a class="dropdown-item" href="/admin/profile">
											<i class="fas fa-id-card me-2"></i>Profile
										</a>
									</li>
									<th:block th:if="${user.role=='ROLE_USER'}">
										<li>
											<a class="dropdown-item" href="/user/user-orders">
												<i class="fas fa-clipboard-list me-2"></i>My Orders
											</a>
										</li>
									</th:block>
									<li><hr class="dropdown-divider"></li>
									<li>
										<a class="dropdown-item text-danger" href="/logout">
											<i class="fas fa-sign-out-alt me-2"></i>Logout
										</a>
									</li>
								</ul>
							</li>
						</th:block>
					</ul>
				</div>
			</div>
		</nav>
	</th:block>
</body>
</html>

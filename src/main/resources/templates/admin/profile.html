<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="ISO-8859-1">
<title>Order Checkout</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<style>
label {
	font-weight: bold;
	font-size: 1rem;
}

.table td {
	font-size: 1rem;
}

.card {
	margin-top: 20px;
}

.table th, .table td {
	border-top: 1px solid #dee2e6;
	padding: 10px;
}

.card-title {
	font-size: 1.25rem;
	font-weight: bold;
}
</style>
</head>
<body>
	<section>
		<div class="container-fluid mt-5 p-5 bg-light">

			<div class="row">
				<div class="col-md-10 offset-md-1">

					<h4 class="text-center mb-3" style="font-weight: 800;">My Profile</h4>
<th:block th:if="${session.succMsg}">
								<p class="text-success fw-bold text-center">[[${session.succMsg}]]</p>
								<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<th:block th:if="${session.errorMsg}">
								<p class="text-danger fw-bold text-center">[[${session.errorMsg}]]</p>
								<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>
					<hr>
					
					<div class="text-center">
				<img alt="" th:src="@{'/profile_img/'+${user.profileImage}}"
					style="width: 110px; height: 110px; border-radius: 50%; border: 3px solid #0d6efd; padding: 5px;">
			</div>


				</div>
				<div class="col-md-8 offset-md-2 mt-4">
					<table class="table table-borderless ">

						<tbody>
							<form action="/admin/update-profile" method="post" enctype="multipart/form-data">
								<tr>

									<th scope="row">Name</th>
									<td>:</td>
									<td><input type="text" name="name" class="form-control"
										th:value="${user.name}" style="border: 3px solid #777777;"></td>
								</tr>
								<tr>
									<th scope="row">Mobile Number</th>
									<td>:</td>
									<td><input type="text" name="mobileNumber" class="form-control"
										th:value="${user.mobileNumber}" style="border: 3px solid #777777;"></td>
								</tr>
								<tr>
									<th scope="row">Email</th>
									<td>:</td>
									<td><input type="text" name="email" class="form-control"
									 readonly	th:value="${user.email}" style="border: 3px solid #777777;"></td>
								</tr>
								<tr>
									<th scope="row">Address</th>
									<td>:</td>
									<td><input type="text" name="address" class="form-control"
										th:value="${user.address}" style="border: 3px solid #777777;"></td>
								</tr>
								<tr>
									<th scope="row">City</th>
									<td>:</td>
									<td><input type="text" name="city" class="form-control"
										th:value="${user.city}" style="border: 3px solid #777777;"></td>
								</tr>
								<tr>
									<th scope="row">State</th>
									<td>:</td>
									<td><input type="text" name="state" class="form-control"
										th:value="${user.state}" style="border: 3px solid #777777;"></td>
								</tr>
								<tr>
									<th scope="row">Pincode</th>
									<td>:</td>
									<td><input type="text" name="pincode" class="form-control"
										th:value="${user.pincode}" style="border: 3px solid #777777;"></td>
								</tr>
								
								<tr>
									<th scope="row">Image</th>
									<td>:</td>
									<td><input type="file" name="img" class="form-control"
										 style="border: 3px solid #777777;"></td>
								</tr>
								
								<tr>
									<th scope="row">Role</th>
									<td>:</td>
									<td><input type="text" name="" class="form-control"
										th:value="${user.role}" readonly style="border: 3px solid #777777;"></td>

								</tr>
							<tr>
								<th scope="row">Account Status</th>
								<td>:</td>
								<td><input type="text" name="" class="form-control"
									th:value="${user.isEnable}" readonly style="border: 3px solid #777777;"></td>
							<input type="hidden" th:value="${user.id}" name="id">
							</tr>
							<tr>
								<td></td>
								<td class="text-center">
									<button class="btn btn-sm bg-primary text-light">Update</button>
								</td>
								<td></td>
							</tr>
							</form>
						</tbody>
					</table>
				</div>

			</div>
			<hr>
			<div class="col-md-10 offset-md-1 mt-1">
				<div class="row">
				
					<p class="text-center fs-3">Change Password</p>	
					<div class="col-md-6 offset-md-3">
					<table class="table table-borderless">
					
						<tbody>
							<form action="/admin/change-password" method="post">
								<tr>
								<th scope="row">Current Password</th>
								<td></td>
								<td><input type="password" name="currentPassword" class="form-control" style="border: 3px solid #777777;">
								</td>
								</tr>
								
								<tr>
								<th scope="row">New Password</th>
								<td></td>
								<td><input type="password" name="newPassword" class="form-control" style="border: 3px solid #777777;"
								></td>
								</tr>
								<tr>
								<th scope="row">Confrim Password</th>
								<td></td>
								<td><input type="password" name="confirmPassword" class="form-control" style="border: 3px solid #777777;">
								</td>
								</tr>
								<tr>
								<td></td>
								<td class="text-center">
									<button class="btn btn-sm bg-primary text-light">Update</button>
								</td>
								<td></td>
							</tr>
							</form>
						</tbody>
						</div>
					</table>
					</div>
					
				</div>
			</div>
		</div>
	</section>
</body>
</html>

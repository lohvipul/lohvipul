<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="ISO-8859-1">
<title>Order Checkout</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<style>
	label {
		font-weight: bold;
		font-size: 1rem;
	}
	.table td {
		font-size: 1rem;
	}
	.card {
		margin-top: 20px;
	}
	.table th, .table td {
		border-top: 1px solid #dee2e6;
		padding: 10px;
	}
	.card-title {
		font-size: 1.25rem;
		font-weight: bold;
	}
</style>
</head>
<body>
	<section>
		<div class="container-fluid mt-5 p-5">
			<form action="/user/save-order" method="post" id="orders" novalidate>
				<div class="row">
					<div class="col-md-6">
						<p class="text-center fs-4 fw-bold">Billing Address</p>
						<div th:if="${errorMsg}" class="alert alert-danger text-center">
    <span th:text="${errorMsg}"></span>
</div>
						<div class="card shadow p-5 mb-5 bg-light rounded">
						<hr>

						<div class="mb-3 row">
							<div class="col p-1">
								<label>First Name</label>
								<input type="text" name="firstName" required class="form-control mt-1">
							</div>
							<div class="col p-1">
								<label>Last Name</label>
								<input type="text" name="lastName" required class="form-control mt-1">
							</div>
						</div>

						<div class="mb-3 row">
							<div class="col p-1">
								<label>Email</label>
								<input type="email" name="email" required class="form-control">
							</div>
							<div class="col p-1">
								<label>Mobile Number</label>
								<input type="text" name="mobileNo" required class="form-control ms-2">
							</div>
						</div>

						<div class="mb-3 row">
							<div class="col p-1">
								<label>Address</label>
								<input type="text" name="address" required class="form-control">
							</div>
							<div class="col p-1">
								<label>City</label>
								<input type="text" name="city" required class="form-control ms-2">
							</div>
						</div>

						<div class="mb-3 row">
							<div class="col p-1">
								<label>State</label>
								<input type="text" name="state" required class="form-control">
							</div>
							<div class="col p-1">
								<label>Pincode</label>
								<input type="number" name="pincode" required class="form-control ms-2">
							</div>
						</div>
						</div>
					</div>

					<div class="col-md-6">
						<p class="text-center fs-4 fw-bold">Payment Type</p>
						<hr>

						<div class="card shadow p-3 mb-3 bg-light rounded">
							<div class="card-body">
								<table class="table table-bordered">
									<tbody>
										<tr>
											<td><strong>Total price</strong></td>
											<td>&#8377; [[${orderPrice}]]</td>
										</tr>
										<tr>
											<td><strong>Delivery Fee</strong></td>
											<td>&#8377; 250</td>
										</tr>
										<tr>
											<td><strong>Tax</strong></td>
											<td>&#8377; 100</td>
										</tr>
										<tr class="table-active">
											<td><strong>Total Price</strong></td>
											<td>&#8377; [[${totalOrderPrice}]]</td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>

						<div class="card shadow p-4 mb-5 bg-body-tertiary rounded">
    <div class="card-body text-center">
        <p class="fs-5 fw-bold mb-3">Choose Your Payment Option</p>
        
        <div class="d-flex gap-3 justify-content-center">
            <button type="submit" 
                    name="paymentType" 
                    value="COD" 
                    class="btn btn-primary flex-fill py-2 fs-5 fw-bold">
                <i class="bi bi-cash-stack me-2"></i> Cash On Delivery
            </button>
            
            <button type="submit" 
                    name="paymentType" 
                    value="ONLINE" 
                    class="btn btn-success flex-fill py-2 fs-5 fw-bold">
                <i class="bi bi-credit-card-2-front me-2"></i> Pay Online
            </button>
        </div>
    </div>
</div>
					</div>

				</div>
			</form>
		</div>
	</section>
</body>
</html>

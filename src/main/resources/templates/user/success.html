<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="ISO-8859-1">
<title>Order Checkout</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<style>
	label {
		font-weight: bold;
		font-size: 1rem;
	}
	.table td {
		font-size: 1rem;
	}
	.card {
		margin-top: 20px;
	}
	.table th, .table td {
		border-top: 1px solid #dee2e6;
		padding: 10px;
	}
	.card-title {
		font-size: 1.25rem;
		font-weight: bold;
	}
</style>
</head>
<body>
	<section>
		<div class="container mt-5 p-5">
			
				<div class="row">
					<div class="col-md-6 offset-md-3 text-center">
					<i class="fa-solid fa-circle-check fa-5x text-success"></i>
					<p class="fs-2"> Product Ordered Successfully</p>
					<p class="fs-4">Product will be delivered with in 7 days</p>
				<a href="/" class="btn btn-primary">Home</a>
					<a href="/user/user-orders" class="btn btn-primary">Your Order</a>
					
					
					</div>
				</div>
		</div>
	</section>
</body>
</html>
